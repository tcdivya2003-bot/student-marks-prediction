<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Marks - Student Marks Prediction Based on Study Hours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">Marks Prediction</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('predict') }}">Predict Marks</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card card-custom p-4">
                    <h3 class="section-title text-center">Enter Study Hours</h3>

                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form id="predictionForm" method="POST" action="{{ url_for('predict') }}" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="study_hours">Number of Study Hours (per day)</label>
                            <input
                                type="number"
                                step="0.1"
                                class="form-control"
                                id="study_hours"
                                name="study_hours"
                                min="0"
                                max="{{ max_hours }}"
                                placeholder="e.g. 6"
                                required
                            >
                            <div class="form-text">Valid range: 0 to {{ max_hours }} hours</div>
                        </div>

                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-primary-custom btn-lg">Predict Marks</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 Student Marks Prediction Based on Study Hours | MCA Academic Project
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
